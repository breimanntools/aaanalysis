name: Notebook Examples (canonical subset)

# Executes a small, canonical subset of example notebooks under nbmake on every
# PR, so a change that breaks a golden-pipeline example fails CI instead of
# shipping a broken copy-paste target to RTD. Notebook execution was a local-only
# gate until now.
#
# The subset is core-only (no pro / embed / structure extras) and covers the
# LOAD -> REPRESENT -> REDUCE -> PROFILE -> PREDICT spine, one representative
# notebook per stage, so the gate stays fast and dependency-light. The full
# examples + tutorials sweep (heavier deps: torch/transformers, biopython, FIMO,
# py3Dmol) is left to a nightly and is not built here.
#
# The second job executes ALL TEN workflow protocols. They are the RTD pages a
# new user reaches first, and they had no execution gate at all: nbmake covered
# only tutorials/ and examples/, integration_e2e.yml runs Python tests rather
# than notebooks, and RTD renders the committed outputs without executing them,
# so a protocol could rot silently. Protocols are teaching-sized (tiny seeded
# datasets), so the whole set is cheap enough to gate on; only protocol 9 needs
# an extra (shap, via [pro]), so the job installs that rather than splitting the
# set. They run in their own job so a protocol failure is legible on the checks
# list and does not mask an example failure.
#
# paths-ignore mirrors the code-gated workflows: a pure-docs change (docs/**,
# *.md, *.rst) cannot break a notebook, so it skips. A change to library code or
# to any tracked notebook still runs the subset.
on:
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '**/*.rst'
  pull_request:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '**/*.rst'

# Cancel a superseded in-progress run on PR branches, but let master runs finish
# so the badge reflects a real pass/fail.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  notebooks:
    name: Execute canonical example subset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache Python dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-nbmake-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-nbmake-

      # Base install only — the subset is core-only, so no pro / embed / structure
      # extras are needed. The editable install compiles the Cython CPP backend.
      - name: Install package + notebook test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest nbmake ipykernel

      # nbmake resolves the kernel named in each notebook's metadata ("python3").
      # Register an ipykernel under that name so the notebooks start on this env.
      - name: Register the python3 Jupyter kernel
        run: python -m ipykernel install --user --name python3

      - name: Execute canonical example subset (nbmake)
        run: >
          pytest --nbmake --nbmake-timeout=300 -p no:cacheprovider
          examples/data_handling/load_dataset.ipynb
          examples/data_handling/load_scales.ipynb
          examples/feature_engineering/sf_feature_matrix.ipynb
          examples/feature_engineering/aac_fit.ipynb
          examples/feature_engineering/cpp_run.ipynb
          examples/pu_learning/dpul_fit.ipynb
          examples/explainable_ai/tm_fit.ipynb
          examples/prediction/aap_fit.ipynb
        env:
          MPLBACKEND: Agg

  protocols:
    name: Execute the ten workflow protocols
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache Python dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-nbmake-pro-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-nbmake-pro-

      # [pro] rather than a base install: protocol 9 (interpretability) fits a
      # ShapModel, so it needs shap. The other nine are core-only, and none of
      # the ten fetches anything over the network, so the set stays offline and
      # deterministic. The editable install compiles the Cython CPP backend.
      - name: Install package + notebook test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[pro]
          pip install pytest nbmake ipykernel

      - name: Register the python3 Jupyter kernel
        run: python -m ipykernel install --user --name python3

      # Sequential on purpose: ten teaching-sized notebooks are cheap, and a
      # deterministic run keeps a first failure easy to read. If this job ever
      # becomes the critical path, `-n auto` (pytest-xdist) is the lever.
      - name: Execute all ten protocols (nbmake)
        run: >
          pytest --nbmake --nbmake-timeout=600 -p no:cacheprovider
          protocols/
        env:
          MPLBACKEND: Agg
